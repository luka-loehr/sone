[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Luka Löhr"]
repository = "https://github.com/luka-loehr/sone"
homepage = "https://lukaloehr.com/sone"
documentation = "https://github.com/luka-loehr/sone/tree/main/docs"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
