<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sone DJ Lab</title>
<style>
:root {
  --bg: #0d0e12; --panel: #16181f; --panel2: #1d2029; --line: #2a2e3a; --text: #e9ebf1; --dim: #8a90a2;
  --a: #ff8a3d; --b: #3dd6ff; --ok: #5ee39a; --star: #ffd23d; --warn: #ff5d73;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: rgba(13,14,18,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
h1 span { color: var(--dim); font-weight: 500; }
.tabs button, .chip, .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font: inherit; cursor: pointer; }
.tabs button.on, .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.spacer { flex: 1; }
label.tog { display: flex; gap: 6px; align-items: center; color: var(--dim); cursor: pointer; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.big { font-size: 26px; font-weight: 700; }
.mx { color: var(--a); } .sp { color: var(--b); }
.dim { color: var(--dim); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--dim); font-weight: 500; }
.tr { display: grid; grid-template-columns: 300px 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 860px) { .tr { grid-template-columns: 1fr; } }
.pair { display: flex; flex-direction: column; gap: 10px; }
.song { display: flex; gap: 10px; align-items: center; }
.song img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--panel2); flex: none; }
.song .t { font-weight: 600; }
.song .meta { font-size: 12px; color: var(--dim); }
.arrow { color: var(--dim); font-size: 12px; padding-left: 20px; }
.styles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { padding: 4px 9px; font-size: 12px; }
.chip.done::after { content: " ✓"; color: var(--ok); }
.chip.on.done::after { color: #178a4b; }
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.ok { color: var(--ok); }
@media (max-width: 600px) { .players { grid-template-columns: 1fr; } }
.pl { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.pl h3 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; }
.pl audio { width: 100%; margin: 6px 0; }
.pl .info { font-size: 12px; color: var(--dim); min-height: 34px; }
.stars { display: flex; gap: 2px; font-size: 22px; cursor: pointer; user-select: none; }
.stars span { color: #3a3f4d; } .stars span.on { color: var(--star); }
.pick { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.pick .btn.on { background: var(--ok); color: #06210f; border-color: var(--ok); }
textarea { width: 100%; margin-top: 8px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; min-height: 38px; resize: vertical; }
.wave { height: 6px; background: var(--line); border-radius: 3px; position: relative; margin-top: 4px; }
.wave i { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--warn); }
.hidden { display: none; }
.insight h2 { font-size: 16px; margin: 0 0 8px; }
.insight p, .insight li { color: #c9ccd6; }
.hist { display: flex; align-items: flex-end; gap: 3px; height: 120px; margin: 10px 0; }
.hist div { background: var(--b); flex: 1; border-radius: 3px 3px 0 0; position: relative; }
.hist div span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--dim); }
kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<header><div class="bar">
  <h1>Sone DJ Lab <span>· Mixxx vs Superpowered</span></h1>
  <div class="tabs"><button data-tab="judge" class="on">Anhören & bewerten</button><button data-tab="score">Ergebnis</button><button data-tab="insight">Datensätze</button></div>
  <div class="spacer"></div>
  <label class="tog"><input type="checkbox" id="blind" checked> Blind (Engine erst nach Bewertung zeigen)</label>
  <label class="tog"><input type="checkbox" id="unrated"> nur unbewertete</label>
</div></header>
<main>
  <section id="tab-judge"></section>
  <section id="tab-score" class="hidden"></section>
  <section id="tab-insight" class="hidden"></section>
</main>
<script>
const STYLE_DE = {
  cut: "Kurzer Blend (2 Takte)", blend: "4-Takt-Blend", bass_swap: "EQ-Blend, Bass-Tausch", filter_blend: "Filter-Blend",
  echo_out: "Echo-out", reverb_wash: "Reverb-Wash", loop_roll: "Loop-Roll, Loop klingt aus", brake: "Vinyl-Brake",
  tempo_ramp: "Tempo-Rampe + Blend", riser: "Noise-Riser + Drop"
};
const STYLE_HOW = {
  cut: "B kommt ohne Bass rein, nach 1 Takt Bass-Tausch, A ist nach 2 Takten weg (~4 s Überlapp).",
  blend: "4 Takte (~8 s) Equal-Power-Crossfade, B auf A's Tempo gestretcht, Beats übereinander.",
  bass_swap: "B kommt ohne Bass rein (Mitten/Höhen blenden 2 Takte hoch), dann Bass-Tausch, A blendet über 2 Takte aus.",
  filter_blend: "A wird per Hochpass über 4 Takte dünn gedreht, B per Tiefpass aufgemacht.",
  echo_out: "2 Takte vorher geht A ins Echo, danach blendet A mit Echo-Fahne aus, während B (Tiefpass öffnet) reinkommt.",
  reverb_wash: "2 Takte vorher wird A in den Hall gezogen, dann blendet A im Hall aus, B kommt gefiltert rein.",
  loop_roll: "Letzter Takt von A als Beat-Repeat 1 → 1/2 → 1/4 → 1/8, danach läuft der Loop 2 Takte weiter und blendet mit Hochpass aus, B kommt drunter.",
  brake: "Plattenteller-Stopp über 4 Beats rund um die Eins, B kommt darunter hoch.",
  tempo_ramp: "A zieht über 8 Takte aufs Tempo von B, dann 2-Takt-Blend – kein Stretching von B.",
  riser: "Rauschen-Riser + Hochpass über 2 Takte, Drop auf B, Riser und A klingen 1 Takt aus."
};
const ENG = { mixxx: "Mixxx", sp: "Superpowered", rust: "Orin Rust (deploybar)" };
let DATA, J = {}, INSIGHTS = null;
const state = { style: {} };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function sides(key, engines) { return [...engines].sort((x, y) => hash(key + x) - hash(key + y)); }
function judged(key) { const j = J[key]; return !!(j && j.stars && Object.keys(j.stars).length >= 1); }

async function save(key, patch) {
  J[key] = { ...(J[key] || {}), ...patch };
  await fetch("/api/judge", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key, ...patch }) });
}

function songHtml(id, eng) {
  const t = DATA.tracks[id];
  const a = t.analysis;
  return `<div class="song"><img loading="lazy" src="covers/${id}.jpg" alt="">
    <div><div class="t">${esc(t.name)}</div><div class="meta">${esc(t.artists.join(", "))}${t.year ? " · " + esc(t.year) : ""}</div>
    <div class="meta"><span class="mx">Mixxx ${a.mixxx.bpm.toFixed(1)} BPM · ${esc(a.mixxx.key)}</span><br><span class="sp">SP ${a.sp.bpm.toFixed(1)} BPM · ${esc(a.sp.key)}</span></div></div></div>`;
}

function renderJudge() {
  const blind = $("#blind").checked, onlyUnrated = $("#unrated").checked;
  const root = $("#tab-judge");
  root.innerHTML = `<p class="dim">${DATA.transitions.length} Übergänge × ${DATA.styles.length} Arten × 2 Engines = ${DATA.transitions.length * DATA.styles.length * 2} Clips. Jeder Clip: ~20 s Song A, ~8 s Übergang (Überlapp), ~16 s Song B ab der Stelle, wo er richtig losgeht. Beats: Beat This! (neuronaler Beat-/Downbeat-Tracker) für beide Engines. <kbd>T</kbd> springt beim zuletzt gestarteten Player auf 18,5 s (kurz vor die Eins).</p>`;
  for (const tr of DATA.transitions) {
    const doneAll = DATA.styles.every(s => judged(`${tr.a}>${tr.b}:${s}`));
    if (onlyUnrated && doneAll) continue;
    let style = state.style[tr.index] || DATA.styles.find(s => !judged(`${tr.a}>${tr.b}:${s}`)) || DATA.styles[0];
    state.style[tr.index] = style;
    const key = `${tr.a}>${tr.b}:${style}`;
    const j = J[key] || {};
    const engines = Object.keys(tr.clips[style]); const order = blind ? sides(key, engines) : engines;
    const reveal = !blind || (J[key] && J[key].stars && engines.every(e => J[key].stars[e]));
    const el = document.createElement("div");
    el.className = "card tr";
    el.innerHTML = `<div class="pair"><div class="dim">#${tr.index + 1}</div>${songHtml(tr.a)}<div class="arrow">↓ geht über in</div>${songHtml(tr.b)}</div>
      <div>
        <div class="styles">${DATA.styles.map(s => `<button class="chip ${s === style ? "on" : ""} ${judged(`${tr.a}>${tr.b}:${s}`) ? "done" : ""}" data-s="${s}">${STYLE_DE[s]}</button>`).join("")}</div>
        <div class="dim" style="margin-bottom:10px">${STYLE_HOW[style]}</div>
        <div class="players">${order.map((e, i) => {
          const c = tr.clips[style][e];
          const name = reveal ? `<span class="${e === "mixxx" ? "mx" : e === "sp" ? "sp" : "ok"}">${ENG[e]}</span>` : `Version ${"XYZ"[i]}`;
          const info = reveal ? `Mixpunkt A ${c.mix_point_a.toFixed(1)} s · ${c.synced ? `sync, B ${c.stretch_pct > 0 ? "+" : ""}${c.stretch_pct.toFixed(1)} %` : "ohne Stretch"} · A ${c.a.bpm.toFixed(1)} → B ${c.b.bpm.toFixed(1)} BPM` : `Übergang bei ${c.t0_in_clip.toFixed(1)} s`;
          const st = (j.stars || {})[e] || 0;
          return `<div class="pl"><h3>${name}<span class="dim">${c.clip_seconds.toFixed(0)} s</span></h3>
            <audio controls preload="none" src="${c.file}" data-t0="${c.t0_in_clip}"></audio>
            <div class="wave"><i style="left:${(100 * c.t0_in_clip / c.clip_seconds).toFixed(1)}%"></i></div>
            <div class="info">${info}</div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div class="stars" data-e="${e}">${[1, 2, 3, 4, 5].map(n => `<span data-n="${n}" class="${n <= st ? "on" : ""}">★</span>`).join("")}</div>
              <button class="btn jump">⏵ zum Übergang</button></div></div>`;
        }).join("")}</div>
        <div class="pick"><span class="dim">Besser:</span>
          ${order.map((e, i) => `<button class="btn ${j.pick === e ? "on" : ""}" data-pick="${e}">${reveal ? ENG[e] : "Version " + "XYZ"[i]}</button>`).join("")}
          <button class="btn ${j.pick === "tie" ? "on" : ""}" data-pick="tie">gleich</button></div>
        <textarea placeholder="Notiz (was klingt gut/schlecht?)">${esc(j.note || "")}</textarea>
      </div>`;
    el.querySelectorAll(".chip").forEach(b => b.onclick = () => { state.style[tr.index] = b.dataset.s; renderJudge(); });
    el.querySelectorAll(".stars").forEach(s => s.onclick = async ev => {
      const n = +ev.target.dataset.n; if (!n) return;
      await save(key, { stars: { ...((J[key] || {}).stars || {}), [s.dataset.e]: n } });
      renderJudge();
    });
    el.querySelectorAll("[data-pick]").forEach(b => b.onclick = async () => { await save(key, { pick: b.dataset.pick }); renderJudge(); });
    const ta = $("textarea", el); ta.onchange = () => save(key, { note: ta.value });
    el.querySelectorAll(".pl").forEach(pl => {
      const au = $("audio", pl);
      au.onplay = () => { document.querySelectorAll("audio").forEach(o => o !== au && o.pause()); window.lastAudio = au; };
      $(".jump", pl).onclick = () => { au.currentTime = Math.max(0, +au.dataset.t0 - 1.5); au.play(); };
    });
    root.appendChild(el);
  }
}

function renderScore() {
  const agg = { mixxx: [], sp: [], rust: [] }, byStyle = {}, picks = { mixxx: 0, sp: 0, rust: 0, tie: 0 };
  for (const [key, j] of Object.entries(J)) {
    const style = key.split(":")[1];
    byStyle[style] ??= { mixxx: [], sp: [], rust: [], picks: { mixxx: 0, sp: 0, rust: 0, tie: 0 } };
    for (const e of ["mixxx", "sp", "rust"]) if (j.stars?.[e]) { agg[e].push(j.stars[e]); byStyle[style][e].push(j.stars[e]); }
    if (j.pick) { picks[j.pick]++; byStyle[style].picks[j.pick]++; }
  }
  const avg = a => a.length ? (a.reduce((x, y) => x + y, 0) / a.length).toFixed(2) : "–";
  const total = DATA.transitions.length * DATA.styles.length;
  const rated = Object.keys(J).filter(judged).length;
  $("#tab-score").innerHTML = `
    <div class="score">
      <div class="card"><div class="dim">Bewertet</div><div class="big">${rated} / ${total}</div></div>
      <div class="card"><div class="dim">Ø Sterne Mixxx</div><div class="big mx">${avg(agg.mixxx)}</div><div class="dim">${agg.mixxx.length} Clips</div></div>
      <div class="card"><div class="dim">Ø Sterne Superpowered</div><div class="big sp">${avg(agg.sp)}</div><div class="dim">${agg.sp.length} Clips</div></div>
      <div class="card"><div class="dim">Ø Sterne Orin Rust</div><div class="big ok">${avg(agg.rust)}</div><div class="dim">${agg.rust.length} Clips</div></div>
      <div class="card"><div class="dim">Direktvergleich (besser)</div><div class="big"><span class="mx">${picks.mixxx}</span> : <span class="sp">${picks.sp}</span> : <span class="ok">${picks.rust}</span></div><div class="dim">${picks.tie}× gleich</div></div>
    </div>
    <div class="card"><table><tr><th>Übergangsart</th><th>Ø Mixxx</th><th>Ø Superpowered</th><th>Ø Orin Rust</th><th>besser Mixxx : SP : Rust : gleich</th></tr>
    ${DATA.styles.map(s => { const b = byStyle[s] || { mixxx: [], sp: [], rust: [], picks: { mixxx: 0, sp: 0, rust: 0, tie: 0 } };
      return `<tr><td>${STYLE_DE[s]}</td><td class="mx">${avg(b.mixxx)}</td><td class="sp">${avg(b.sp)}</td><td class="ok">${avg(b.rust)}</td><td>${b.picks.mixxx} : ${b.picks.sp} : ${b.picks.rust} : ${b.picks.tie}</td></tr>`; }).join("")}
    </table><p class="dim">Bewertungen liegen in <code>lab/judgments.json</code> – ich lese sie direkt aus.</p></div>`;
}

function renderInsight() {
  const I = INSIGHTS;
  if (!I) { $("#tab-insight").innerHTML = "<p class='dim'>lädt…</p>"; return; }
  const max = Math.max(...I.minutes_hist.map(x => x[1]));
  $("#tab-insight").innerHTML = `
  <div class="card insight"><h2>djmix-Datensatz (mir-aidj, 1001Tracklists / mixesdb)</h2>
    <p>${I.mixes.toLocaleString("de")} echte DJ-Mixes, ${I.slots.toLocaleString("de")} auswertbare Track-Slots mit Zeitstempel. Ein Track läuft im Mix im Median <b>${I.median_minutes} min</b> (Ø ${I.mean_minutes} min) – DJs spielen Songs fast nie ganz aus.</p>
    <div class="hist">${I.minutes_hist.map(([m, n]) => `<div style="height:${(100 * n / max).toFixed(0)}%"><span>${m}</span></div>`).join("")}</div>
    <p class="dim" style="margin-top:22px">Minuten pro Track im Mix</p>
    <h2>Deine Songs in echten DJ-Sets</h2><ul>${I.hits.map(h => `<li><b>${esc(h.name)}</b> – ${esc(h.artist)}: in ${h.count} Mixes</li>`).join("") || "<li>keine</li>"}</ul>
  </div>
  <div class="card insight" style="margin-top:12px"><h2>Was die Studie (ISMIR 2020, 20.765 Übergänge) über echte DJs zeigt</h2><ul>
    <li><b>Tempo:</b> 86,1 % der Tracks werden um &lt; 5 % verändert, 94,5 % um &lt; 10 %. → Wir stretchen nur bis ±12 %, sonst Übergänge ohne Sync (Echo, Brake, Reverb, Tempo-Rampe).</li>
    <li><b>Tonart:</b> nur 2,5 % der Tracks werden transponiert (fast immer 1 Halbton). → Keylock an, Tonart nur für die Songreihenfolge (Camelot).</li>
    <li><b>Phrasen:</b> Übergangslängen häufen sich bei Vielfachen von 32 Beats. → Unsere Mixpunkte liegen auf 8-Takt-Phrasen (32 Beats), Blends dauern 32 Beats.</li>
    <li><b>Cue-Punkte:</b> 40,4 % der Cue-Punkte verschiedener DJs liegen innerhalb eines Takts, 73,6 % innerhalb von 8 Takten. → Gute Ein-/Ausstiegspunkte sind vorhersagbar – lernbar aus Songstruktur.</li>
    <li><b>Genre-Bias:</b> Datensatz ist fast nur House/Trance. Pop/Rap-Radio mischt kürzer – darum testen wir hier auch Cut, Echo-out und Brake.</li>
  </ul></div>`;
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  for (const t of ["judge", "score", "insight"]) $("#tab-" + t).classList.toggle("hidden", t !== b.dataset.tab);
  if (b.dataset.tab === "score") renderScore();
  if (b.dataset.tab === "insight") renderInsight();
});
$("#blind").onchange = renderJudge;
$("#unrated").onchange = renderJudge;
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "t" && window.lastAudio) { const a = window.lastAudio; a.currentTime = Math.max(0, +a.dataset.t0 - 1.5); a.play(); }
});
(async () => {
  [DATA, J] = await Promise.all([fetch("data.json").then(r => r.json()), fetch("/api/judgments").then(r => r.json())]);
  INSIGHTS = await fetch("insights.json").then(r => r.json()).catch(() => null);
  renderJudge();
})();
</script>
</body>
</html>
