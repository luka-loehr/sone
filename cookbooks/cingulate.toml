# Cingulate: `cargo run -p sone-train --release -- cingulate --config cookbooks/cingulate.toml`
# Trains on all examples, good and broken.

[run]
backend = "wgpu"
seed = 1
steps = 100000
batch_size = 128
dir = "runs/critic"
log_every = 100
valid_every = 2000
loader_threads = 4

[optim]
lr = 5e-4
warmup_steps = 2000
min_lr_ratio = 0.02
weight_decay = 1e-2
grad_clip = 1.0

[model]                   # defaults: dim 96, 4 layers, 4 heads, ff 384

[data]
train = ["data/examples"]
valid = []
valid_fraction = 0.05

[loss]
good = 1.0
issues = 1.0
issue_pos_weight = 5.0    # every issue is rare
