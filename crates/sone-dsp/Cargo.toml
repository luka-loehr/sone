[package]
name = "sone-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Deterministic audio DSP for Sone: Linkwitz-Riley EQ, lanes, echo, reverb, limiter, BS.1770-4 LUFS, and key-locked time stretch"

[features]
default = ["files"]
# WAV reading and writing for the command line tools; off in the Worker.
files = ["dep:hound"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sone-core = { path = "../sone-core" }
realfft = "3.4"
hound = { version = "3.5", optional = true }

[[bin]]
name = "stretch"
required-features = ["files"]

[[bin]]
name = "onsets"
required-features = ["files"]
