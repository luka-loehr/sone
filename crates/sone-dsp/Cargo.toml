[package]
name = "sone-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Signal processing of the renderer: filters, lanes, echo, reverb, limiter, loudness, onsets, key-locked time stretch"

[features]
default = ["files"]
# WAV reading and writing for the command line tools; off in the Worker.
files = ["dep:hound"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sone-core = { path = "../sone-core" }
realfft = "3.4"
hound = { version = "3.5", optional = true }

[[bin]]
name = "stretch"
required-features = ["files"]

[[bin]]
name = "onsets"
required-features = ["files"]
