[package]
name = "sone-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly C ABI exposing Sone transition planning and windowed stem rendering for browsers and edge workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sone-core = { path = "../sone-core" }
sone-plan = { path = "../sone-plan" }
sone-dsp = { path = "../sone-dsp", default-features = false }
sone-render = { path = "../sone-render", default-features = false }
