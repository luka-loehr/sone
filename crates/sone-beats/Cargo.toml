[package]
name = "sone-beats"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Neuro-symbolic multi-octave comb-grid beat/downbeat tracking and Beat This! inference in pure Rust (wasm32-safe)"

[features]
default = ["files"]
# Reading audio and weights files from disk; disable in WebAssembly builds.
files = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sone-core = { path = "../sone-core" }
matrixmultiply = { version = "0.3.10", default-features = false, features = ["std"] }
libm = "0.2.16"

[[bin]]
name = "beats"
required-features = ["files"]
