[package]
name = "sone-models"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Backend-generic Burn neural architectures and sone-infer/1 .safetensors exporters for Cochlea, Tympanum, Cortex, and Cingulate"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sone-core = { path = "../sone-core" }
# Configs, tensor names and the safetensors writer live there (no ML runtime in it).
sone-infer = { path = "../sone-infer" }
burn = { version = "=0.21.0", default-features = false, features = ["std"] }

[dev-dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray", "autodiff"] }
