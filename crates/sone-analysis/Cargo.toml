[package]
name = "sone-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Streaming stem and metrical feature extractor producing 24-feature BeatTables (wasm32-safe)"

[features]
default = ["files"]
# FLAC stems, beat files and JSON on disk (the binary); off in the Worker.
files = ["dep:claxon", "sone-beats/files"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sone-core = { path = "../sone-core" }
sone-beats = { path = "../sone-beats", default-features = false }
realfft = "3.4"
claxon = { version = "0.4.3", optional = true }

[[bin]]
name = "analyse"
required-features = ["files"]

[[bin]]
name = "phaselab"
required-features = ["files"]

[[bin]]
name = "voicelab"
required-features = ["files"]
