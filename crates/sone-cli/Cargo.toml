[package]
name = "sone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified Sone CLI: transition mixing, 4-stem separation, metrical analysis, planning, live streaming, and simulation"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hound = "3.5"
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "wav", "pcm"] }
sone-core = { path = "../sone-core" }
sone-beats = { path = "../sone-beats" }
sone-analysis = { path = "../sone-analysis" }
sone-plan = { path = "../sone-plan" }
sone-dsp = { path = "../sone-dsp" }
sone-render = { path = "../sone-render" }
sone-live = { path = "../sone-live" }
sone-sim = { path = "../sone-sim" }
sone-infer = { path = "../sone-infer" }
