[package]
name = "sone-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Zero-dependency FP16/FP32 .safetensors runtime for Sone's four neural organs (Cochlea, Tympanum, Cortex, Cingulate)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sone-core = { path = "../sone-core" }
# Pure-Rust GEMM, wasm32-safe; single-threaded on purpose (one core is the budget).
matrixmultiply = { version = "0.3.10", default-features = false, features = ["std"] }

[dev-dependencies]
flate2 = "1"

