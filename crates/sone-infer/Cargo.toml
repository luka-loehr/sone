[package]
name = "sone-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The four networks without an ML runtime: plain loops and sgemm over f16 safetensors, native and wasm32"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sone-core = { path = "../sone-core" }
# Pure-Rust GEMM, wasm32-safe; single-threaded on purpose (one core is the budget).
matrixmultiply = { version = "0.3.10", default-features = false, features = ["std"] }

[dev-dependencies]
flate2 = "1"

[[example]]
name = "cochlea_bench"

